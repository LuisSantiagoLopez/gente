name: gente-windows
# Gente self-healing gates call this: the packaged-app smoke test (memory check → setup →
# sign up → first reply) on real Windows x64/arm64 and macOS arm64/Intel. The steps live in
# gente-platforms.yml; only that workflow's own runs attach installers to the draft release.
on:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: write
jobs:
  platforms:
    uses: ./.github/workflows/gente-platforms.yml
