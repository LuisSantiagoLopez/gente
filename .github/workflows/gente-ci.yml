# Gente's merge gate. Every pull request to main must pass both jobs:
#  1. unit: the Gente test suites (setup, brain, window chrome, privacy wording, help links, ...).
#  2. mac-package: builds the server and the macOS app, and the afterPack step boots the server
#     from inside the packaged .app (fails on any missing module).
name: gente-ci
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gente-ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true
jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
      - run: npm i -g pnpm@12.18.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - name: "Desktop (every test: main process, preload, setup page, 14 language catalogs)"
        working-directory: apps/desktop
        run: npx vitest run --root ../.. apps/desktop/src
      - name: Web (every unit test, including the 14 language catalogs)
        working-directory: apps/web
        run: npx vitest run --root ../.. apps/web/src apps/web/server
      - name: Server and adapters (help pages, web tools, greeting, fast chat)
        run: >
          npx vitest run
          packages/adapters/src/tools/builtin-skills.test.ts
          packages/adapters/src/web
          packages/adapters/src/providers/web
          packages/adapters/src/providers/computer/e2b/gente-cloud-sdk.test.ts
          packages/adapters/src/runtime/pi/models
          packages/adapters/src/mcp
          packages/adapters/src/providers/integration/composio/composio-key.test.ts
          packages/adapters/src/computers/computer-task-limit.test.ts
          packages/adapters/src/computers/orphan-computers.test.ts
          packages/adapters/src/runs/lifecycle/run-model-outage.test.ts
          packages/adapters/src/runs/tools/run-tools.test.ts
          packages/adapters/src/runs/wakeups/wakeup.test.ts
          packages/adapters/src/runtime/pi/stream/pi-runtime-yield.test.ts
          packages/adapters/src/storage/thread-artifacts.test.ts
          packages/adapters/src/storage/thread-artifacts.store.test.ts
          packages/core/src/primitives/user-error.test.ts
          apps/api/src/bots/hidden-turns.prompt.test.ts
      # Approvals: the four always-ask kinds (spend, send as the owner, delete, legal terms) ask in
      # every mode including Never ask; auto-approve limits; loop guard; find_tool hints.
      - name: Approvals and tool guardrails
        run: >
          npx vitest run
          packages/core/src/runs
          packages/adapters/src/runs/tools
          packages/adapters/src/runs/turn/tool-loop.test.ts
          packages/adapters/src/runs/executor/executor-readonly-approval.test.ts
          packages/adapters/src/runs/executor/executor-loop-guard.test.ts
          packages/adapters/src/runs/executor/executor.test.ts
          packages/adapters/src/tools/builtin-tool-bridge.test.ts
  mac-package:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
      - run: npm i -g pnpm@12.18.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm --filter @rakazo/web build
        env: { RAKAZO_ALLOW_DEV_SECRETS: "1", RAKAZO_DESKTOP_RELEASE: "1" }
      - name: Server bundle, unpacked where the app build picks it up
        run: |
          node scripts/build-server-bundle.mjs "$RUNNER_TEMP/bundle" "https://github.com/${GITHUB_REPOSITORY}/releases/download/v0.2.0"
          mkdir -p apps/desktop/build/server-dir
          cp "$RUNNER_TEMP/bundle/server-bundle.json" apps/desktop/build/
          tar -xJf "$RUNNER_TEMP"/bundle/rakazo-server-darwin-arm64-*.tar.xz -C apps/desktop/build/server-dir
        env: { RAKAZO_ALLOW_DEV_SECRETS: "1" }
      - run: pnpm --filter @rakazo/desktop build
      - name: Package the app; afterPack boots the server from inside it
        working-directory: apps/desktop
        run: npx electron-builder --mac dir --arm64 --publish never -c.mac.identity=null
      - name: Zip the packaged app (keeps symlinks and permissions)
        run: |
          APP=$(ls -d apps/desktop/out/mac-arm64/*.app | head -1)
          ditto -c -k --sequesterRsrc --keepParent "$APP" "$RUNNER_TEMP/Gente-mac-arm64.zip"
          shasum -a 256 "$RUNNER_TEMP/Gente-mac-arm64.zip" | tee "$RUNNER_TEMP/Gente-mac-arm64.zip.sha256"
          echo "commit ${GITHUB_SHA}" >> "$RUNNER_TEMP/Gente-mac-arm64.zip.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: gente-mac-arm64-${{ github.sha }}
          path: |
            ${{ runner.temp }}/Gente-mac-arm64.zip
            ${{ runner.temp }}/Gente-mac-arm64.zip.sha256
          retention-days: 7
          compression-level: 0
