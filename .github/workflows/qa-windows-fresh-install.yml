# QA: an outside user's first install on a clean Windows machine, from the live joinyourai.com link.
# Runs only on pushes to qa/windows-fresh-install. Uploads screenshots and logs as an artifact.
name: qa-windows-fresh-install
on:
  push:
    branches: [qa/windows-fresh-install]
jobs:
  fresh:
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with: { sparse-checkout: "apps/desktop/scripts/ollama-stub.mjs\nqa", sparse-checkout-cone-mode: false }
      - uses: actions/setup-node@v4
        with: { node-version: 24.15.0 }
      - name: Machine
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Get-ComputerInfo -Property OsName,OsVersion,OsArchitecture,CsTotalPhysicalMemory | Format-List | Tee-Object out/machine.txt
          Get-PSDrive C,D -ErrorAction SilentlyContinue | Format-Table | Tee-Object -Append out/machine.txt
      - name: Download from the live site, like a visitor
        shell: pwsh
        run: |
          $ua = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/142.0.0.0 Safari/537.36"
          curl.exe -sI -A $ua "https://joinyourai.com/api/download?os=win&test=nolog" | Select-String -Pattern "^(HTTP|location)" | Tee-Object out/download.txt
          $dest = "$env:USERPROFILE\Downloads\Your-AI-Setup.exe"
          # Since 25 Nov ~3:24 PM PT the site puts an email + Terms gate in front of the download
          # (/api/download without a signed link redirects to /?get=win#get). The test does not submit the
          # gate (no fake leads); it then takes the same file the gate hands out, from the release.
          $loc = (curl.exe -sI -A $ua "https://joinyourai.com/api/download?os=win&test=nolog" | Select-String -Pattern "^location:\s*(\S+)").Matches.Groups[1].Value
          $url = $loc
          if ($loc -notlike "https://github.com/*") { $note = "gate in front of the download (redirect: $loc); using the release file"; Write-Host $note; Add-Content out/download.txt $note; $url = "https://github.com/LuisSantiagoLopez/gente/releases/download/v1.0.6/Your-AI-Setup-1.0.6.exe" }
          "url=$url" | Tee-Object -Append out/download.txt
          Invoke-WebRequest -Uri $url -OutFile $dest -UserAgent $ua
          $mz = [System.IO.File]::ReadAllBytes($dest)[0..1]; if ([char]$mz[0] + [char]$mz[1] -ne "MZ") { throw "downloaded file is not a Windows program" }
          Set-Content -Path $dest -Stream Zone.Identifier -Value "[ZoneTransfer]`r`nZoneId=3`r`nHostUrl=https://joinyourai.com/"
          $f = Get-Item $dest
          "size=$($f.Length) sha256=$((Get-FileHash $dest -Algorithm SHA256).Hash)" | Tee-Object -Append out/download.txt
          $sig = Get-AuthenticodeSignature $dest
          "authenticode=$($sig.Status) signer=$($sig.SignerCertificate.Subject)" | Tee-Object -Append out/download.txt
          Get-Content -Path $dest -Stream Zone.Identifier | Tee-Object -Append out/download.txt
      - name: Install (silent NSIS), check files
        shell: pwsh
        timeout-minutes: 30
        run: |
          Add-Type -AssemblyName System.Windows.Forms,System.Drawing
          function Shot($name) { try { $b = [System.Windows.Forms.SystemInformation]::VirtualScreen; $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height; $g = [System.Drawing.Graphics]::FromImage($bmp); $g.CopyFromScreen($b.Left, $b.Top, 0, 0, $bmp.Size); $bmp.Save("out/install-$name.png"); $g.Dispose(); $bmp.Dispose() } catch { "shot failed: $_" | Add-Content out/install.txt } }
          $dest = "$env:USERPROFILE\Downloads\Your-AI-Setup.exe"
          # Hosted runners ship with Defender real-time scanning off; a real PC has it on, and it scans every
          # file the installer writes. Turn it on so the install time is what a person would see.
          Set-MpPreference -DisableRealtimeMonitoring $false -ErrorAction SilentlyContinue
          Start-Sleep 5
          "defender before install: $((Get-MpComputerStatus -ErrorAction SilentlyContinue | Select-Object RealTimeProtectionEnabled,AntivirusEnabled,OnAccessProtectionEnabled | Out-String).Trim() -replace '\s+',' ')" | Tee-Object out/install.txt
          $sw = [Diagnostics.Stopwatch]::StartNew()
          "start $(Get-Date -Format o)" | Tee-Object -Append out/install.txt
          # Start-Process (ShellExecute) on a file with an Internet-zone mark opens the
          # "Open File - Security Warning" prompt and blocks on a headless runner. A person double-clicking
          # sees SmartScreen/that prompt instead. Start the installer directly so the test measures the install.
          $psi = New-Object System.Diagnostics.ProcessStartInfo $dest, "/S"; $psi.UseShellExecute = $false
          $p = [System.Diagnostics.Process]::Start($psi)
          "installer pid=$($p.Id)" | Tee-Object -Append out/install.txt
          $i = 0
          while (-not $p.HasExited -and $sw.Elapsed.TotalMinutes -lt 25) {
            Start-Sleep 30; $i++
            $dir = "$env:LOCALAPPDATA\Programs\gente"
            $n = if (Test-Path "$dir\resources\rakazo-server") { (Get-ChildItem "$dir\resources\rakazo-server" -Directory -ErrorAction SilentlyContinue | Measure-Object).Count } else { -1 }; $sz = if (Test-Path "$dir\Your AI.exe") { "exe-present" } else { "no-exe" }
            $procs = Get-CimInstance Win32_Process | Where-Object { $_.Name -match "Your|Setup|nsExec" } | ForEach-Object { $cl = [string]$_.CommandLine; if ($cl.Length -gt 200) { $cl = $cl.Substring(0,200) }; "$($_.Name)[$($_.ProcessId)] $cl" }
            "t=$([int]$sw.Elapsed.TotalSeconds)s $sz serverTopDirs=$n procs=$($procs -join ' | ')" | Tee-Object -Append out/install.txt
            if ($i % 4 -eq 1) { Shot "t$([int]$sw.Elapsed.TotalSeconds)" }
          }
          "installer exited=$($p.HasExited) exit=$(if ($p.HasExited) { $p.ExitCode }) seconds=$([int]$sw.Elapsed.TotalSeconds)" | Tee-Object -Append out/install.txt
          Shot "end"
          Get-MpComputerStatus -ErrorAction SilentlyContinue | Select-Object RealTimeProtectionEnabled,AntivirusEnabled | Format-List | Out-String | Add-Content out/install.txt
          if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force; Get-Process | Where-Object { $_.ProcessName -match "Your AI" } | Stop-Process -Force -ErrorAction SilentlyContinue }
          $done = Test-Path "$env:LOCALAPPDATA\Programs\gente\resources\rakazo-server\.complete"
          "server unpack complete marker=$done" | Tee-Object -Append out/install.txt
          $exe = Get-ChildItem "$env:LOCALAPPDATA\Programs" -Recurse -Filter "Your AI.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $exe) { $exe = Get-ChildItem "C:\Program Files" -Recurse -Filter "Your AI.exe" -ErrorAction SilentlyContinue | Select-Object -First 1 }
          "exe=$($exe.FullName)" | Tee-Object -Append out/install.txt
          if (-not $exe) { throw "Your AI.exe not found after install" }
          $bytes = [System.IO.File]::ReadAllBytes($exe.FullName); $pe = [BitConverter]::ToInt32($bytes,0x3c); $m = [BitConverter]::ToUInt16($bytes,$pe+4)
          "pe machine=0x{0:x} (0x8664=x64, 0xaa64=arm64)" -f $m | Tee-Object -Append out/install.txt
          Get-ChildItem "$env:USERPROFILE\Desktop","$env:APPDATA\Microsoft\Windows\Start Menu\Programs" -Filter "*Your AI*" -Recurse -ErrorAction SilentlyContinue | ForEach-Object { "shortcut=$($_.FullName)" } | Tee-Object -Append out/install.txt
          Add-Content $env:GITHUB_ENV "YOURAI_EXE=$($exe.FullName)"
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: windows-install, path: out, retention-days: 14 }
      - name: Playwright
        timeout-minutes: 10
        shell: bash
        run: mkdir -p /c/qa && cd /c/qa && npm init -y >/dev/null && npm i --silent playwright-core@1.64.1 && cp "$GITHUB_WORKSPACE/qa/first-run.mjs" .
      - name: Real first run (no stand-in model) - what a new user sees during setup, 12 minutes
        timeout-minutes: 20
        shell: bash
        continue-on-error: true
        run: cd /c/qa && node first-run.mjs "$YOURAI_EXE" "$GITHUB_WORKSPACE/out/real" real 12
      - name: Stop the app and any Ollama it started
        if: always()
        timeout-minutes: 5
        shell: pwsh
        run: |
          Get-Process | Where-Object { $_.ProcessName -match "Your AI|ollama|postgres" } | Format-Table Id,ProcessName,WS -AutoSize | Out-String | Tee-Object out/processes-after-real.txt
          Get-Process | Where-Object { $_.ProcessName -match "Your AI|ollama|postgres" } | Stop-Process -Force -ErrorAction SilentlyContinue
          Start-Sleep 3
          Get-ChildItem "$env:APPDATA" -Directory | Where-Object Name -match "Your AI|gente|rakazo|Burrow" | ForEach-Object { Copy-Item -Recurse -ErrorAction SilentlyContinue "$($_.FullName)\logs" "out/real-app-logs-$($_.Name)"; Copy-Item -Recurse -ErrorAction SilentlyContinue "$($_.FullName)\stack\logs" "out/real-stack-logs-$($_.Name)" }
          (Get-NetTCPConnection -LocalPort 11434 -State Listen -ErrorAction SilentlyContinue | Measure-Object).Count | ForEach-Object { "listeners on 11434 after stop: $_" } | Tee-Object -Append out/processes-after-real.txt
      - name: Account creation and first chat (stand-in model in the test process, CPU runner)
        if: always()
        timeout-minutes: 35
        shell: bash
        run: cd /c/qa && node first-run.mjs "$YOURAI_EXE" "$GITHUB_WORKSPACE/out/stub" stub 25
      - name: Final logs
        if: always()
        timeout-minutes: 5
        shell: pwsh
        run: |
          Get-Process | Where-Object { $_.ProcessName -match "Your AI|ollama|postgres" } | Stop-Process -Force -ErrorAction SilentlyContinue
          Get-ChildItem "$env:APPDATA" -Directory | Where-Object Name -match "Your AI|gente|rakazo|Burrow" | ForEach-Object { Copy-Item -Recurse -Force -ErrorAction SilentlyContinue "$($_.FullName)\logs" "out/final-app-logs-$($_.Name)"; Copy-Item -Recurse -Force -ErrorAction SilentlyContinue "$($_.FullName)\stack\logs" "out/final-stack-logs-$($_.Name)" }
          Get-ChildItem "$env:APPDATA" -Directory | Where-Object Name -match "Your AI|gente|rakazo|Burrow" | Get-ChildItem -Recurse -File -ErrorAction SilentlyContinue | Select-Object -First 200 FullName,Length | Format-Table -AutoSize | Out-String -Width 300 | Set-Content out/appdata-files.txt
          foreach ($m in "real","stub") { if (Test-Path "out/$m/run.log") { "== $m"; Get-Content "out/$m/run.log" -Tail 60 } }
      - name: Evidence - the same installer through Start-Process (ShellExecute), with and without the Internet mark
        if: always()
        timeout-minutes: 6
        continue-on-error: true
        shell: pwsh
        run: |
          # Runs last, into throwaway folders, so it cannot change where the real install went.
          $src = "$env:USERPROFILE\Downloads\Your-AI-Setup.exe"
          foreach ($case in "marked","unmarked") {
            $t = "$env:TEMP\probe-$case\Your-AI-Setup.exe"; New-Item -ItemType Directory -Force (Split-Path $t) | Out-Null; Copy-Item $src $t -Force
            if ($case -eq "marked") { Set-Content -Path $t -Stream Zone.Identifier -Value "[ZoneTransfer]`r`nZoneId=3`r`nHostUrl=https://joinyourai.com/" } else { Remove-Item -Path $t -Stream Zone.Identifier -ErrorAction SilentlyContinue }
            $j = Start-Job { param($t, $d) $sw = [Diagnostics.Stopwatch]::StartNew(); $p = Start-Process $t -ArgumentList "/S", "/D=$d" -PassThru; "Start-Process returned after $([int]$sw.Elapsed.TotalSeconds)s pid=$($p.Id)" } -ArgumentList $t, "C:\probe-$case"
            Start-Sleep 20; try { Add-Type -AssemblyName System.Windows.Forms,System.Drawing; $b = [System.Windows.Forms.SystemInformation]::VirtualScreen; $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height; $g = [System.Drawing.Graphics]::FromImage($bmp); $g.CopyFromScreen($b.Left, $b.Top, 0, 0, $bmp.Size); $bmp.Save("$PWD/out/probe-$case-20s.png") } catch { "shot failed: $_" | Add-Content out/probe.txt }
            $r = if (Wait-Job $j -Timeout 40) { "$case : $(Receive-Job $j)" } else { "$case : Start-Process still blocked after 60s (prompt waiting for a click)" }
            $r | Tee-Object -Append out/probe.txt
            Get-CimInstance Win32_Process | Where-Object { $_.ExecutablePath -like "*probe-*" -or $_.Name -match "Your-AI-Setup" } | ForEach-Object { "  running: $($_.Name) $($_.ExecutablePath)" ; Stop-Process -Id $_.ProcessId -Force -ErrorAction SilentlyContinue } | Tee-Object -Append out/probe.txt
            Stop-Job $j -ErrorAction SilentlyContinue; Remove-Job $j -Force -ErrorAction SilentlyContinue
          }
          Get-Content out/probe.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: windows-fresh-install, path: out, retention-days: 14 }
