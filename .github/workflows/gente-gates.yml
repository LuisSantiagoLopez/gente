name: gente-gates
# Gente self-healing, step 5: every fix for the canary branch passes every gate, on real runners,
# before it can merge. A fix PR labeled "self-heal" merges by itself only when all of them pass.
# Nothing here can be skipped: the merge job needs every gate job, and a skipped job is not a pass.
on:
  pull_request:
    branches: [canary]
  workflow_call:
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: gente-gates-${{ github.ref }}
  cancel-in-progress: true
jobs:
  full-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
      - run: npm i -g pnpm@12.18.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - name: Desktop and self-healing tests
        run: pnpm exec vitest run apps/desktop/src scripts/self-heal
      - name: Repo checks
        run: pnpm checks
      - name: Help prices match Gente Cloud's plan list
        run: node scripts/gente-plans.mjs --check
      - name: Desktop typecheck
        run: pnpm --filter @rakazo/desktop exec tsc --noEmit -p tsconfig.json

  chaos:
    strategy:
      matrix:
        os: [macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
      - run: npm i -g pnpm@12.18.0
      - run: pnpm install --frozen-lockfile
      - name: Chaos subset (five real faults against the real health checks)
        run: pnpm exec tsx scripts/self-heal/chaos.ts --json chaos-${{ matrix.os }}.json
      - name: Full failure catalog (every failure injected, repaired and timed)
        run: pnpm exec tsx scripts/self-heal/chaos-catalog.ts --json chaos-catalog-${{ matrix.os }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chaos-${{ matrix.os }}
          path: |
            chaos-${{ matrix.os }}.json
            chaos-catalog-${{ matrix.os }}.json

  smoke:
    # The packaged-app smoke test, built the same way as gente-platforms.yml (server and Postgres
    # inside the app): install, setup, sign up, first reply against a stand-in model server.
    name: smoke (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-2025, label: windows-x64, arch: x64, kind: win }
          - { os: macos-15, label: macos-arm64, arch: arm64, kind: mac }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
      - run: npm i -g pnpm@12.18.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm --filter @rakazo/web build
        env: { RAKAZO_ALLOW_DEV_SECRETS: "1", RAKAZO_DESKTOP_RELEASE: "1" }
      - name: Server bundle inside the app (with embedded Postgres)
        run: |
          node scripts/build-server-bundle.mjs "$RUNNER_TEMP/bundle"
          node scripts/gente-embed-server.mjs "$RUNNER_TEMP/bundle"
        env: { RAKAZO_ALLOW_DEV_SECRETS: "1" }
      - run: pnpm --filter @rakazo/desktop build
      - name: Windows installer
        if: matrix.kind == 'win'
        working-directory: apps/desktop
        run: npx electron-builder --win nsis --${{ matrix.arch }} --publish never -c.win.verifyUpdateCodeSignature=false
      - name: Mac disk image (unsigned until certificates exist)
        if: matrix.kind == 'mac'
        working-directory: apps/desktop
        env: { CSC_IDENTITY_AUTO_DISCOVERY: "false" }
        run: npx electron-builder --mac dmg --${{ matrix.arch }} --publish never -c.mac.identity=null -c.mac.notarize=false
      - name: Install
        run: |
          mkdir -p "$RUNNER_TEMP/e2e"
          if [ "${{ matrix.kind }}" = win ]; then
            exe=$(ls apps/desktop/out/*.exe | head -1)
            powershell -NoProfile -Command "Start-Process -Wait -FilePath '$(cygpath -w "$exe")' -ArgumentList '/S'"
            app="$LOCALAPPDATA/Programs/Gente/Gente.exe"
          else
            dmg=$(ls apps/desktop/out/*.dmg | head -1)
            mnt=$(hdiutil attach -nobrowse -readonly "$dmg" | tail -1 | cut -f3-)
            cp -R "$mnt/Gente.app" /Applications/
            hdiutil detach "$mnt" -quiet || true
            app=/Applications/Gente.app/Contents/MacOS/Gente
          fi
          echo "APP=$app" >> "$GITHUB_ENV"
      - name: Smoke test (setup → sign up → first reply; stand-in model on 11434)
        timeout-minutes: 45
        run: node apps/desktop/e2e/gente-smoke.mjs "$APP" "$RUNNER_TEMP/e2e"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-${{ matrix.label }}
          path: ${{ runner.temp }}/e2e

  merge-self-heal:
    # Runs only when every gate above passed. Fix PRs from the pipeline carry the "self-heal" label.
    needs: [full-tests, chaos, smoke]
    if: github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'self-heal')
    runs-on: ubuntu-24.04
    steps:
      - name: Merge into canary (squash; the canary release workflow takes it from here)
        env:
          GH_TOKEN: ${{ secrets.SELF_HEAL_TOKEN || github.token }}
        run: gh pr merge "${{ github.event.pull_request.number }}" --repo "${{ github.repository }}" --squash --delete-branch
