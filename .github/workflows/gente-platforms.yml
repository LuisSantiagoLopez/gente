name: gente-platforms
# Builds Gente on real Windows and macOS runners with the server and its Postgres inside the app,
# installs the installer, then runs memory check → setup → sign up → "hey" → reply against a
# stand-in model server. Uploads screenshots, logs and step times; on success, attaches the
# installer to the draft release (never publishes it).
on:
  workflow_dispatch:
  workflow_call:
  push:
    branches: [platforms]
permissions:
  contents: write
concurrency:
  group: gente-platforms-${{ github.ref }}
  cancel-in-progress: false
env:
  DRAFT_TAG: v1.0.0
jobs:
  gente:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-2025, label: windows-x64, arch: x64, kind: win }
          - { os: windows-11-arm, label: windows-arm64, arch: arm64, kind: win }
          - { os: macos-15, label: macos-arm64, arch: arm64, kind: mac }
          - { os: macos-15-intel, label: macos-intel, arch: x64, kind: mac }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
      - run: npm i -g pnpm@12.18.0
      - name: Every download address answers (release gate)
        run: for i in 1 2 3; do node scripts/gente-check-downloads.mjs && exit 0; sleep 20; done; exit 1
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm --filter @rakazo/web build
        env: { RAKAZO_ALLOW_DEV_SECRETS: "1", RAKAZO_DESKTOP_RELEASE: "1" }
      - name: Server bundle inside the app (with embedded Postgres)
        run: |
          node scripts/build-server-bundle.mjs "$RUNNER_TEMP/bundle"
          node scripts/gente-embed-server.mjs "$RUNNER_TEMP/bundle"
        env: { RAKAZO_ALLOW_DEV_SECRETS: "1" }
      - run: pnpm --filter @rakazo/desktop build
      - name: Windows installer
        if: matrix.kind == 'win'
        working-directory: apps/desktop
        run: >-
          npx electron-builder --win nsis --${{ matrix.arch }} --publish never
          -c.win.verifyUpdateCodeSignature=false
          '-c.nsis.artifactName=Your-AI-Setup-${version}${{ matrix.arch == 'x64' && '' || '-arm64' }}.${ext}'
      - name: Mac disk image
        if: matrix.kind == 'mac'
        working-directory: apps/desktop
        env: { CSC_IDENTITY_AUTO_DISCOVERY: "false" }
        run: >-
          npx electron-builder --mac dmg --${{ matrix.arch }} --publish never
          -c.mac.identity=null -c.mac.notarize=false
          '-c.dmg.artifactName=Your-AI-${version}-${arch}.${ext}'
      - name: Install (timed)
        run: |
          mkdir -p "$RUNNER_TEMP/e2e"
          start=$(date +%s)
          if [ "${{ matrix.kind }}" = win ]; then
            exe=$(ls apps/desktop/out/*.exe | head -1)
            powershell -NoProfile -Command "Start-Process -Wait -FilePath '$(cygpath -w "$exe")' -ArgumentList '/S'"
            echo "installed under:"; ls "$LOCALAPPDATA/Programs/"
            app=$(ls -d "$LOCALAPPDATA"/Programs/*/"Your AI.exe" | head -1)
            dir=$(dirname "$app")
            # The installer writes the server out with Node (paths over 260 characters).
            ls "$dir/resources/"
            cat "$dir/resources/rakazo-server/.complete" && echo " (server written out by the installer)"
          else
            dmg=$(ls apps/desktop/out/*.dmg | head -1)
            mnt=$(hdiutil attach -nobrowse -readonly "$dmg" | tail -1 | cut -f3-)
            cp -R "$mnt/Your AI.app" /Applications/
            hdiutil detach "$mnt" -quiet || true
            app="/Applications/Your AI.app/Contents/MacOS/Your AI"
          fi
          test -x "$app" || test -f "$app"
          echo "{\"install\": $(( $(date +%s) - start ))}" > "$RUNNER_TEMP/e2e/install.json"
          echo "APP=$app" >> "$GITHUB_ENV"
          cat "$RUNNER_TEMP/e2e/install.json"
      - name: Free port 11434 for the stand-in model (stop any Ollama the runner or a launch started)
        run: |
          if [ "${{ matrix.kind }}" = win ]; then
            tasklist | grep -i ollama || true
            taskkill //F //IM ollama.exe //T 2>/dev/null || true
            taskkill //F //IM "ollama app.exe" //T 2>/dev/null || true
          else
            pgrep -fl -i ollama || true
            pkill -9 -i ollama || true
          fi
          sleep 2
      - name: Smoke test (memory check → setup → sign up → first reply; stand-in model on 11434)
        timeout-minutes: 45
        run: node apps/desktop/e2e/gente-smoke.mjs "$APP" "$RUNNER_TEMP/e2e"
      - name: Collect logs (stack, Postgres, main-process errors)
        if: always()
        run: |
          roaming="$HOME/Library/Application Support"
          [ -n "$APPDATA" ] && roaming="$(cygpath -u "$APPDATA")"
          for name in "Your AI" Gente Burrow; do
            d="$roaming/$name"
            [ -d "$d" ] || continue
            echo "data folder: $d"; ls -la "$d" "$d/stack" 2>/dev/null || true
            [ -d "$d/stack/logs" ] && cp -r "$d/stack/logs" "$RUNNER_TEMP/e2e/stack-logs-$name" || true
            [ -d "$d/logs" ] && cp -r "$d/logs" "$RUNNER_TEMP/e2e/app-logs-$name" || true
          done
          for f in "$RUNNER_TEMP"/e2e/stack-logs-*/*.log "$RUNNER_TEMP"/e2e/app-logs-*/*.log; do
            [ -f "$f" ] && { echo "== $f"; tail -40 "$f"; } || true
          done
      - name: Step times
        if: always()
        run: |
          node -e '
            const fs = require("fs"), dir = process.argv[1];
            const read = (f) => { try { return JSON.parse(fs.readFileSync(dir + "/" + f, "utf8")); } catch { return {}; } };
            const t = { ...read("install.json"), ...read("timings.json") };
            const s = (v) => (v === undefined ? "not reached" : `${v}s`);
            const row = `| ${process.argv[2]} | ${s(t.install)} | ${s(t["workspace-ready"] - (t["setup-shown"] ?? 0) || undefined)} | ${s(t["first-reply"])} | ${s(t["reply-seconds"])} |`;
            const out = ["| OS | install | setup (Get started → app) | launch → first reply | reply |", "|---|---|---|---|---|", row].join("\n");
            console.log(out);
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, out + "\n");
            fs.writeFileSync(dir + "/times.json", JSON.stringify(t, null, 2));
          ' "$RUNNER_TEMP/e2e" "${{ matrix.label }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gente-${{ matrix.label }}
          path: ${{ runner.temp }}/e2e
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: installer-${{ matrix.label }}
          path: |
            apps/desktop/out/*.exe
            apps/desktop/out/*.dmg
      - name: Attach the installer to the draft release (never published)
        # Only this workflow's own runs; gates that call it (gente-windows) test without attaching.
        if: success() && github.workflow == 'gente-platforms'
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          test "$(gh release view "$DRAFT_TAG" --json isDraft -q .isDraft)" = true
          for f in apps/desktop/out/*.exe apps/desktop/out/*.dmg; do
            if [ -f "$f" ]; then gh release upload "$DRAFT_TAG" "$f" --clobber; fi
          done
