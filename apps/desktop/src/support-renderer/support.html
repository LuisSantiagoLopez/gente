<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; base-uri 'none'; form-action 'none'" />
    <title>Gente Support</title>
    <link rel="stylesheet" href="tokens.css" />
    <link rel="stylesheet" href="support.css" />
  </head>
  <body>
    <header class="top">
      <div class="title">
        <span class="mark" aria-hidden="true"></span>
        <h1 data-t="title">Support</h1>
      </div>
      <button id="status" class="status" type="button" aria-expanded="false" aria-controls="health">
        <span class="dot" data-tone="unknown"></span><span id="status-text" data-t="checking">Checking…</span>
      </button>
      <button id="open-settings" class="icon" type="button" data-t-label="settings" aria-label="Settings">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M12 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7Zm7.43-2.53.04-.97-.04-.97 2.11-1.65-2-3.46-2.49 1a7.6 7.6 0 0 0-1.68-.97L15 3.5h-4l-.37 2.45c-.6.24-1.17.57-1.68.97l-2.49-1-2 3.46 2.11 1.65-.04.97.04.97-2.11 1.65 2 3.46 2.49-1c.51.4 1.08.73 1.68.97L11 20.5h4l.37-2.45c.6-.24 1.17-.57 1.68-.97l2.49 1 2-3.46-2.11-1.65Z"/></svg>
      </button>
    </header>

    <section id="health" class="health" hidden></section>
    <section id="report" class="card report" hidden></section>
    <section id="settings" class="card settings" hidden></section>

    <div class="tabs" role="tablist">
      <button type="button" role="tab" id="tab-ask" aria-selected="true" data-t="ask">Ask</button>
      <button type="button" role="tab" id="tab-help" aria-selected="false" data-t="help">Help articles</button>
    </div>

    <main id="ask" class="ask" role="tabpanel" aria-labelledby="tab-ask">
      <div id="thread" class="thread" aria-live="polite">
        <div id="empty" class="empty">
          <p class="hello" data-t="hello">Hi! What can I help with?</p>
          <div class="chips" id="chips"></div>
        </div>
      </div>
      <form id="composer" class="composer">
        <textarea id="question" rows="1" data-t-placeholder="placeholder" placeholder="Ask anything about Gente…"></textarea>
        <button id="send" type="submit" data-t-label="send" aria-label="Send">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M12 4.5 19.5 12 18 13.4l-5-5V20h-2V8.4l-5 5L4.5 12 12 4.5Z"/></svg>
        </button>
      </form>
    </main>

    <main id="help" class="help" role="tabpanel" aria-labelledby="tab-help" hidden>
      <input id="help-search" type="search" data-t-placeholder="search" placeholder="Search help" />
      <ul id="articles" class="articles"></ul>
      <article id="article" class="article" hidden></article>
    </main>

    <template id="ticket-form">
      <form class="card ticket">
        <p class="ticket-lead" data-t="ticketLead">A person will read this and reply by email, usually within a day.</p>
        <label><span data-t="email">Your email</span><input name="email" type="email" required autocomplete="email" /></label>
        <label><span data-t="whatHappened">What happened?</span><textarea name="message" rows="4" required></textarea></label>
        <label class="check"><input name="includeReport" type="checkbox" /> <span data-t="includeReport">Include an error report (no chats, no personal data)</span></label>
        <div class="row">
          <button type="submit" class="primary" data-t="sendTicket">Send to a person</button>
          <span class="ticket-status" role="status"></span>
        </div>
      </form>
    </template>

    <script src="support.js"></script>
  </body>
</html>
